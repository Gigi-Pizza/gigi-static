<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Carte promotionnelle de Gigi Pizzeria</title>
  <desc id="description">La pizzeria de quartier de l’Ouest-de-l’Île. Appelez au (514) 697-4587.</desc>

  <defs>
    <linearGradient id="brand-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#731316"/>
      <stop offset="1" stop-color="#4d090b"/>
    </linearGradient>
    <linearGradient id="photo-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d090b" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#4d090b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="photo-clip">
      <path d="M625 0H1200V630H585C651 514 683 396 676 278C669 157 633 65 558 0Z"/>
    </clipPath>
    <filter id="logo-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#240304" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#brand-background)"/>

  <!-- Calque de photographie remplaçable -->
  <g clip-path="url(#photo-clip)">
    <image id="food-photo" href="Gigi-pizza-menu2-2025.jpg" xlink:href="Gigi-pizza-menu2-2025.jpg" x="545" y="-32" width="720" height="694" preserveAspectRatio="xMidYMid slice"/>
    <rect x="545" width="655" height="630" fill="url(#photo-shade)"/>
  </g>

  <!-- Calque du logo officiel remplaçable -->
  <g filter="url(#logo-shadow)">
    <circle cx="159" cy="142" r="107" fill="#fffaf0" stroke="#e7b93f" stroke-width="4"/>
    <image id="brand-logo" href="GigiLogo.png" xlink:href="GigiLogo.png" x="67" y="50" width="184" height="184" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- TEXTE MODIFIABLE : changez le contenu de ces éléments text/tspan. -->
  <g id="editable-copy" fill="#fffaf0" font-family="DM Sans, Helvetica Neue, Arial, sans-serif">
    <text id="brand-title" x="52" y="330" font-size="64" font-weight="800" letter-spacing="-2">GIGI PIZZERIA</text>
    <rect x="54" y="356" width="86" height="5" rx="2.5" fill="#e7b93f"/>
    <text id="tagline" x="54" y="405" font-size="27" font-weight="700" letter-spacing="0.4">
      <tspan x="54" dy="0">LA PIZZERIA DE QUARTIER</tspan>
      <tspan x="54" dy="36">DE L’OUEST-DE-L’ÎLE</tspan>
    </text>
    <text id="phone" x="52" y="548" font-size="54" font-weight="800" letter-spacing="1">(514) 697-4587</text>
  </g>
</svg>
